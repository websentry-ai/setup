# Source for the unbound-discovery binary (WEB-4787, Stream B).
# The binary IS the distribution — no git clone / install.sh on target machines.
# SOURCE_REF is whatever `git fetch` accepts: a branch tracks that branch, a full
# 40-char SHA pins to it. It tracks main so discovery changes ship on the next
# runtime release without a lock bump; set a SHA here to freeze a release.
SOURCE_REPO=https://github.com/websentry-ai/coding-discovery-tool.git
SOURCE_REF=main
SOURCE_ENTRYPOINT=scripts/coding_discovery_tools/ai_tools_discovery.py
PYTHON_VERSION=3.12.10
PYINSTALLER_VERSION=6.14.1
TARGET_ARCH=universal2
