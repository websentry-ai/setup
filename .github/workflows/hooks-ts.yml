name: hooks-ts

# Gate on the TypeScript hooks core + pi extension under hooks-ts/.
# test.yml / static-checks.yml gate the Python tree; this one gates the TS tree
# and — critically — that the committed build output pi/index.js is not stale.
# Same triggers as test.yml, narrowed by paths so Python-only PRs skip it.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "hooks-ts/**"
      - "pi/index.js"
      - ".github/workflows/hooks-ts.yml"
  push:
    branches: [staging, main]
    paths:
      - "hooks-ts/**"
      - "pi/index.js"
      - ".github/workflows/hooks-ts.yml"

# This job runs `npm ci` over third-party devDependencies (esbuild, typescript,
# the pi package). Read-only is all it needs, so a compromised dependency gets
# no write scope from the job token.
permissions:
  contents: read

defaults:
  run:
    working-directory: hooks-ts

jobs:
  hooks-ts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hooks-ts/package-lock.json

      - name: Install
        run: npm ci

      # typecheck + build + unit tests.
      - name: Test
        run: npm test

      # npm test does not cover these: the INST-05 assertions run against the
      # file `npm test` just built (no runtime imports, ESM, size bound).
      - name: Build assertions
        run: npm run test:build

      # The committed artifact is what users download; a stale copy would ship
      # behaviour that no longer matches the source in this same commit.
      - name: pi/index.js matches a fresh build
        run: |
          cmp -s dist/pi/index.js ../pi/index.js || {
            echo "::error::pi/index.js is stale — run: cd hooks-ts && npm run build && cp dist/pi/index.js ../pi/index.js"
            exit 1
          }
          echo "pi/index.js is byte-identical to dist/pi/index.js ($(wc -c < ../pi/index.js) bytes)."
