name: hooks-ts

# Gate on the TypeScript hooks core + agent extensions under hooks-ts/.
# test.yml / static-checks.yml gate the Python tree; this one gates the TS tree
# and — critically — that every committed build target (<name>/index.js and its
# .sha256 sidecar, one per entry in hooks-ts/scripts/targets.mjs) is not stale.
# Same triggers as test.yml, narrowed by paths so Python-only PRs skip it.
# The index.js path filters below match any top-level directory, so adding a
# build target needs no edit here.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "hooks-ts/**"
      - "*/index.js"
      - "*/index.js.sha256"
      - ".github/workflows/hooks-ts.yml"
  push:
    branches: [staging, main]
    paths:
      - "hooks-ts/**"
      - "*/index.js"
      - "*/index.js.sha256"
      - ".github/workflows/hooks-ts.yml"

# This job runs `npm ci` over third-party devDependencies (esbuild, typescript,
# the pi package). Read-only is all it needs, so a compromised dependency gets
# no write scope from the job token.
permissions:
  contents: read

defaults:
  run:
    working-directory: hooks-ts

jobs:
  hooks-ts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hooks-ts/package-lock.json

      - name: Install
        run: npm ci

      # typecheck + build + unit tests.
      - name: Test
        run: npm test

      # npm test does not cover these: the INST-05 assertions run against the
      # file `npm test` just built (no runtime imports, ESM, size bound).
      - name: Build assertions
        run: npm run test:build

      # The committed artifacts are what users download; a stale copy would ship
      # behaviour that no longer matches the source in this same commit. For every
      # target in scripts/targets.mjs this compares the committed artifact with the
      # fresh build byte for byte, and its sidecar with both (hash and path field).
      # A target with no build output fails; it is never skipped.
      - name: Committed artifacts match a fresh build (every target)
        run: npm run artifacts:check

      # Each installer refuses to install unless the artifact it downloads matches its
      # sidecar, so a rotted sidecar breaks every install while a byte compare stays green.
      # artifacts:check already verified the hashes; this repeats it with the system tool,
      # because `shasum -c` is the check users can run themselves.
      # Run from the repo root, not hooks-ts: a sidecar names the path `<name>/index.js`,
      # and that is the path `shasum -c` resolves relative to its own working directory.
      - name: Committed sidecars verify with shasum (every target)
        working-directory: .
        run: |
          SIDECARS="$(node hooks-ts/scripts/targets.mjs --sidecars)"
          [ -n "$SIDECARS" ] || {
            echo "::error::hooks-ts/scripts/targets.mjs listed no sidecars"
            exit 1
          }
          FAILED=0
          for sidecar in $SIDECARS; do
            shasum -a 256 -c "$sidecar" || {
              echo "::error::$sidecar does not verify — run: cd hooks-ts && npm run build && npm run artifacts:sync"
              FAILED=1
            }
          done
          exit "$FAILED"
