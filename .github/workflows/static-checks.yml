name: static-checks

# Guards every *.py against the bug class where a function is referenced but
# never defined: a NameError that only surfaces when a user runs the command.
# This is the syntax gate and runs across the whole tree, including files the
# suite does not import. Behaviour is gated separately by test.yml.

on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pyflakes
        run: pip install pyflakes==3.4.0

      - name: Compile every Python file (syntax errors)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" || { echo "COMPILE FAIL: $f"; fail=1; }
          done < <(find . -name '*.py' -not -path '*/node_modules/*' -print0)
          exit $fail

      - name: Fail on undefined names (NameError guard)
        run: |
          # pyflakes also reports unused imports etc; we only gate on the
          # NameError class to keep this green on pre-existing style noise.
          found=$(python -m pyflakes . 2>&1 | grep -i 'undefined name' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Undefined name(s) found — would crash at runtime. Fix before merging."
            exit 1
          fi
          echo "No undefined names."

      # Fail-open contract gate (WEB-4808). packaging/ holds the hermetic
      # boundary tests for the scheduled root discovery daemon's credential
      # channel: the SACRED fail-open path (absent/unreadable/malformed config
      # must idle-and-exit-0) and the writer side (atomic 0600 file, 0750 dir).
      # These tests need no built bundle and no upstream package, so they run
      # here on EVERY PR — the parity suite under binary/tests/ only runs on
      # the macOS release build, which would let a fail-open regression merge.
      - name: Install pytest
        run: pip install pytest==9.0.3

      - name: Run packaging boundary tests (discovery fail-open + writer)
        run: python -m pytest packaging/ -q
